## L'algèbre de Boole
### Qu'est-ce que l'algèbre booléenne ?

L'**algèbre booléenne** est une partie des mathématiques qui s'intéresse aux **opérations** et aux **fonctions** sur les variables logiques.

Aujourd'hui, l'algèbre de Boole trouve de nombreuses applications en informatique et dans la conception des circuits électroniques.

<img height="300px" src="img/boole.jpg">
<br>
<span style="font-style:italic; font-size:14px">George Boole, inventeur de l'algèbre de Boole</span>

---
## L'algèbre de Boole
### Valeurs de vérité

On appelle B l'ensemble constitué de deux éléments appelés **valeurs de vérité {VRAI, FAUX}**.

Cet ensemble est aussi noté **B = {1, 0}**.

<img height="300px" src="img/yes_no.png">

## Lois de De Morgan
### Une première réflexion

Soit a et b les propositions suivantes : 

* a : ce programme est écrit en C
* b : ce programme est écrit en Javascript

On écrit "Ce programme est écrit en C ou en Javascript" de la manière suivante :

<img height="80px" src="img/aoub.png">

```da
┌── if (a OR b)
│ 
│ // a est vrai ou b est vrai (ou les deux)
│ 
├── else
│ 
│ // ??
│ 
└──
```

## Lois de De Morgan
### Retour à la problématique

Soit a et b les propositions suivantes : 

* a : ce programme est écrit en C
* b : ce programme est écrit en Javascript


```da
┌── if (a OR b)
│ 
│ // a est vrai ou b est vrai (ou les deux)
│ 
├── else
│ 
│ // a est faux et b est faux
│ 
└──
```

Ou en français : "Ce programme n'est pas écrit en C et n'est pas non plus écrit en Javascript"

## L'algèbre de Boole
### Une problématique plus complexe...
Supposons qu'une entreprise développe un système d'éclairage intelligent pour un bâtiment. Le système doit contrôler l'allumage des lumières en fonction des conditions suivantes :

* A : Une personne est présente dans la pièce (A=1) ou non (A=0).
* B : Il fait jour (B=1) ou nuit (B=0).
* C : La pièce est utilisée pour une réunion (C=1) ou non (C=0).
* D : Les rideaux sont ouverts (D=1) ou fermés (D=0).

L'objectif est d'allumer la lumière (L=1) dans les cas suivants :

* Une personne est présente, il fait nuit, et la pièce est utilisée pour une réunion.
* Une personne est présente, il fait jour, la pièce est utilisée pour une réunion, et les rideaux sont fermés.
* Une personne est présente, il fait jour, la pièce n'est pas utilisée pour une réunion, mais les rideaux sont fermés.

L'objectif est de concevoir une fonction logique pour l'allumage des lumières en fonction des variables A, B, C, et D.
