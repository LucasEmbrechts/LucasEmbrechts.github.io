## Le Code "Spaghetti" (À ÉVITER ❌)
```php
<?php
$db = new PDO('mysql:host=localhost;dbname=ecole', 'root', '');
$eleve = $db->query("SELECT * FROM eleves WHERE id = " . $_GET['id'])->fetch();
?>
<html>
  <h1><?= $eleve['nom'] ?> <?= $eleve['prenom'] ?></h1>
  <p>Classe: <?= $eleve['classe'] ?></p>
  <p>Option: <?= $eleve['option'] ?></p>
  <?php
    if ($_POST['action'] === 'update') {
      $db->query("UPDATE eleves SET nom = '" . $_POST['nom'] . "' WHERE id = " . $_GET['id']);
    }
  ?>
</html>
```
**Problèmes graves** 🔴
- Injections SQL : Failles de sécurité critiques
- Code impossible à maintenir : Tout mélangé
- Pas testable : Impossible d'écrire des tests
- Dangereux : Peut causer des accidents graves

## MVC : Les 3 Couches

.container-code[

#### **MODEL** 📊
- Gère les données
- Accès à la base de données
- Logique métier
- Retourne des données

#### **VIEW** 🎨
- Affiche les données
- Code HTML/CSS
- Reçoit les données du Controller
- Ne fait pas de requêtes SQL

]

---
## MVC : Les 3 Couches (Suite)

#### **CONTROLLER** 🎮
- Reçoit les requêtes utilisateur
- Appelle le Model si nécessaire
- Charge la Vue appropriée
- Fait le lien entre Model et View

<div style="margin-top: 40px; text-align: center;">
  <strong style="font-size: 18px;">Le Controller est l'orchestrateur !</strong>
</div>

## Architecture des Fichiers
```
ecole-app/
├── index.php                  (Point d'entrée)
├── Database.php               (Connexion MySQL)
├── models/
│   └── Eleve.php             (Gestion des élèves)
├── controllers/
│   └── EleveController.php   (Logique gestion élèves)
└── views/
    ├── list.php              (Tableau de tous les élèves)
    ├── show.php              (Détails d'un élève)
    └── classe.php            (Élèves d'une classe)
```

---
## Étape 1️⃣ : La Connexion (Database.php)

```php
<?php
class Database {
  private $pdo;

  public function __construct() {
    $this->pdo = new PDO(
      'mysql:host=localhost;dbname=ecole',
      'root',
      ''
    );
    $this->pdo->setAttribute(
      PDO::ATTR_ERRMODE,
      PDO::ERRMODE_EXCEPTION
    );
  }

  public function query($sql, $params = []) {
    $stmt = $this->pdo->prepare($sql);
    $stmt->execute($params);
    return $stmt->fetchAll(PDO::FETCH_ASSOC);
  }
}
```

---
## Étape 2️⃣ : Le Modèle (models/Post.php)

```php
<?php
class Eleve {
  private $db;

  public function __construct($database) {
    $this->db = $database;
  }

  // Récupérer tous les élèves
  public function getAll() {
    return $this->db->query(
      "SELECT * FROM eleves ORDER BY nom, prenom"
    );
  }

  // Récupérer un élève par ID
  public function getById($id) {
    $result = $this->db->query(
      "SELECT * FROM eleves WHERE id = ?",
      [$id]
    );
    return $result[0] ?? null;
  }

  // Récupérer les élèves d'une classe
  public function getByClasse($classe) {
    return $this->db->query(
      "SELECT * FROM eleves WHERE classe = ?",
      [$classe]
    );
  }
}
```
<small>Le Model gère les élèves et leurs données</small>


---
## Étape 3️⃣ : Le Contrôleur (controllers/PostController.php)

```php
<?php
class EleveController {
  private $model;

  public function __construct($model) {
    $this->model = $model;
  }

  // Action : afficher la liste
  public function listAction() {
    $eleves = $this->model->getAll();
    require 'views/list.php';
  }

  // Action : afficher les détails d'un élève
  public function showAction($id) {
    $eleve = $this->model->getById($id);
    require 'views/show.php';
  }

  // Action : afficher par classe
  public function classeAction($classe) {
    $eleves = $this->model->getByClasse($classe);
    require 'views/classe.php';
  }
}
```
<small>Le Controller gère la logique des élèves</small>


---
## Étape 4️⃣ : La Vue (views/list.php)

```php
<html>
  <head><title>Liste des Élèves</title></head>
  <body>
    <h1>Tous les Élèves</h1>
    <table border="1" cellpadding="10">
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Date Naissance</th>
        <th>Classe</th>
        <th>Option</th>
        <th>Actions</th>
      </tr>
      <?php foreach ($eleves as $eleve): ?>

          <td><?= htmlspecialchars($eleve['nom']) ?></td>
          <td><?= htmlspecialchars($eleve['prenom']) ?></td>
          <td><?= htmlspecialchars($eleve['date_naissance']) ?></td>
          <td><?= htmlspecialchars($eleve['classe']) ?></td>
          <td><?= htmlspecialchars($eleve['option']) ?></td>
          <td>
            <a href="?action=show&id=<?= $eleve['id'] ?>">Voir</a>
          </td>
        </tr>
      <?php endforeach; ?>
    </table>
  </body>
</html>
```
<small>La Vue affiche le tableau des élèves</small>

## Étape 5️⃣ : Le Point d'Entrée (index.php)

```php
<?php
// 1. Charger les classes
require 'Database.php';
require 'models/Eleve.php';
require 'controllers/EleveController.php';

// 2. Créer la connexion
$db = new Database();

// 3. Créer le modèle avec la BD
$model = new Eleve($db);

// 4. Créer le contrôleur avec le modèle
$controller = new EleveController($model);

// 5. Router simple
$action = $_GET['action'] ?? 'list';
$id = $_GET['id'] ?? null;
$classe = $_GET['classe'] ?? null;

if ($action === 'list') {
  $controller->listAction();
} elseif ($action === 'show' && $id) {
  $controller->showAction($id);
} elseif ($action === 'classe' && $classe) {
  $controller->classeAction($classe);
}
?>
```
<small>Ceci assemble tous les composants pour la gestion des élèves</small>


---
## Flux Complet d'une Requête

URL: index.php?action=show&id=7

1. Router (index.php) → détecte action=show, id=7
2. Controller → appelle model->getById(7)
3. Model → interroge la BDD (SELECT * FROM eleves WHERE id = 7)
4. BDD → retourne les données de l'élève #7
5. Model → retourne (nom, prénom, date naissance, classe, option)
6. Controller → charge views/show.php avec l'élève
7. Vue → affiche les détails complets de l'élève
8. Navigateur → reçoit le HTML avec toutes les informations

## Avantages de MVC

✅ **Maintenance** : Changer la vue ne touche pas au modèle

✅ **Testabilité** : On peut tester le Model indépendamment

✅ **Réutilisabilité** : Un Model peut servir plusieurs Vues

✅ **Évolutivité** : Facile d'ajouter de nouvelles fonctionnalités

✅ **Travail en équipe** : Designer sur les Vues, Dev sur Model/Controller

✅ **Pas de code "spaghetti"** : Chaque partie a sa place


---
## MVC vs Code Spaghetti

| Aspect | Spaghetti | MVC |
|--------|-----------|-----|
| **Localisation** | SQL partout | SQL au même endroit (Model) |
| **Évolution** | Risqué | Sûr et isolé |
| **Test** | Impossible | Facile pour chaque partie |
| **Équipe** | Conflits | Travail parallèle |
| **Performance** | Peut être rapide | Très rapide si bien conçu |
| **Lisibilité** | Horrible | Excellent |


---
## Pièges à Éviter ❌

❌ Mettre de la logique dans la Vue

❌ Faire des requêtes SQL dans le Controller

❌ Retourner un objet compliqué du Model

❌ Charger plusieurs Modèles dans un Controller

❌ Oublier de nettoyer les entrées utilisateur

✅ Garder chaque part simple et responsable
