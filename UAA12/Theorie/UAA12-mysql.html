### Étape 1 : Connexion à MySQL

```php
<?php
$connexion = mysqli_connect("localhost", "utilisateur", "motdepasse", "nom_base");

if (!$connexion) {
    die("Erreur de connexion : " . mysqli_connect_error());
}

echo "Connexion réussie !";
?>
```

### Étape 2 : Exécuter une requête SELECT

```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

$sql = "SELECT * FROM produits";
$resultat = mysqli_query($connexion, $sql);

if ($resultat) {
    echo "Requête exécutée avec succès !";
} else {
    echo "Erreur : " . mysqli_error($connexion);
}
?>
```

<div class="concept-card">
<div class="concept-header">
<span class="concept-icon">📡</span>
<h4 class="concept-title">mysqli_query()</h4>
</div>
<p>Envoie une requête SQL au serveur MySQL. Retourne un objet résultat pour SELECT, ou <code>true</code>/<code>false</code> pour INSERT, UPDATE, DELETE.</p>
</div>

### Étape 3 : Récupérer les résultats

```php
<?php
$sql = "SELECT * FROM produits";
$resultat = mysqli_query($connexion, $sql);

// Parcourir tous les résultats
while ($ligne = mysqli_fetch_assoc($resultat)) {
    echo $ligne['nom'] . " - " . $ligne['prix'] . " euros<br>";
}
?>
```

<div class="concept-card">
<div class="concept-header">
<span class="concept-icon">🔄</span>
<h4 class="concept-title">mysqli_fetch_assoc()</h4>
</div>
<p>Récupère une ligne du résultat sous forme de tableau associatif. Retourne <code>NULL</code> quand il n'y a plus de lignes.</p>
</div>

### Étape 4 : Fermer la connexion

```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

// ... vos requêtes ...

mysqli_close($connexion);
?>
```

<div class="concept-card" style="padding: 0.8rem 1rem; margin: 0.5rem 0;">

<h4 class="concept-title" style="font-size: 1rem;">mysqli_close()</h4>
</div>
<p style="font-size: 0.95rem; margin: 0;">Ferme la connexion au serveur MySQL et libère les ressources associées. Bonne pratique : toujours l'appeler à la fin du script.</p>
</div>

### Exemple complet

```php
<?php
// 1. Connexion
$connexion = mysqli_connect("localhost", "root", "", "boutique");
if (!$connexion) {
    die("Erreur : " . mysqli_connect_error());
}
// 2. Requête
$sql = "SELECT * FROM produits WHERE prix < 100";
$resultat = mysqli_query($connexion, $sql);
// 3. Affichage des résultats
if (mysqli_num_rows($resultat) > 0) {
    while ($produit = mysqli_fetch_assoc($resultat)) {
        echo $produit['nom'] . " : " . $produit['prix'] . " euros<br>";
    }
} else {
    echo "Aucun produit trouvé.";
}
// 4. Fermeture
mysqli_close($connexion);
?>
```

### Requête INSERT

```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

$sql = "INSERT INTO produits (nom, prix) VALUES ('T-shirt', 29.99)";

if (mysqli_query($connexion, $sql)) {
    echo "Produit ajouté avec succès !";
    echo "ID du nouveau produit : " . mysqli_insert_id($connexion);
} else {
    echo "Erreur : " . mysqli_error($connexion);
}

### Les injections SQL : une menace réelle

<div>

</div>
<p style="font-size:0.85rem; margin: 0 0 0.5rem 0;">Une attaque où un utilisateur malveillant <strong>insère du code SQL</strong> dans un champ de formulaire pour manipuler la requête exécutée par le serveur.</p>
<div class="concept-header" style="margin-bottom: 0.4rem; padding-bottom: 0.4rem; border-top: 2px solid rgba(0,117,143,0.1); padding-top: 0.4rem;">

<h4 class="concept-title" style="font-size:0.95rem;">Yahoo, 2012</h4>
</div>
<p style="font-size:0.85rem; margin: 0 0 0.3rem 0;">Un hacker a extrait <strong>400 000 identifiants et mots de passe</strong> via une injection SQL. Les mots de passe étaient stockés <strong>en clair</strong>.</p>
<a href="https://www.bbc.com/news/technology-18811300" target="_blank" style="font-size:0.8rem; display:inline-block; margin-bottom: 0.4rem;">📎 Source : BBC News</a>
<div class="warning-box" style="padding: 0.4rem 0.8rem; margin: 0;">
<p class="warning-text" style="margin:0; font-size:0.82rem;">🚨 Ce type d'attaque est encore l'une des plus répandues aujourd'hui.</p>
</div>
</div>
</div>

---
### Danger : Injection SQL

.small-code[
```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

// ⚠️ La variable vient directement du formulaire !
$email = $_POST['email'];
$mdp   = $_POST['mdp'];

$sql = "SELECT * FROM utilisateurs WHERE email = '$email' AND mdp = '$mdp'";
$resultat = mysqli_query($connexion, $sql);

if (mysqli_num_rows($resultat) > 0) {
    echo "Connecté !";  // ← l'attaquant arrive ici
} else {
    echo "Email ou mot de passe incorrect.";
}
?>
<form method="POST">
    <input type="text"     name="email" placeholder="Email">
    <input type="password" name="mdp"   placeholder="Mot de passe">
    <button type="submit">Se connecter</button>
</form>
```
]

---
### Injection SQL — Comment ça marche ?

<div class="comparison-grid">
<div class="comparison-card bad">
<div class="comparison-header">👤 Ce que l'attaquant entre</div>
<p style="font-size:0.95rem; margin-bottom:0.3rem;"><strong>Email :</strong></p>
<code>' OR '1'='1' #</code>
<p style="font-size:0.95rem; margin: 0.5rem 0 0.3rem;"><strong>Mot de passe :</strong> <em>(n'importe quoi)</em></p>
<code>blabla</code>
</div>
<div class="comparison-card bad">
<div class="comparison-header">💥 Requête générée</div>
<p style="font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--error-color); margin:0;">
SELECT * FROM utilisateurs<br>
WHERE email = <strong>'' OR '1'='1' #</strong><br>
AND mdp = 'blabla'
</p>
<p style="font-size:0.9rem; margin-top:0.5rem;">Le <code>#</code> est un commentaire SQL (MySQL/MariaDB) : tout ce qui suit est <strong>ignoré</strong>, y compris la vérification du mot de passe.</p>
</div>
</div>

<div class="warning-box" style="padding: 0.6rem 1rem; margin: 0.5rem 0;">
<div class="warning-header" style="margin-bottom: 0.2rem;">
<span class="warning-icon" style="font-size: 1.1rem;">🚨</span>
<h4 class="warning-title" style="font-size: 0.95rem;">Résultat</h4>
</div>
<p class="warning-text" style="font-size: 0.9rem; margin: 0;"><code>'1'='1'</code> est toujours vrai → tous les utilisateurs sont retournés → <code>mysqli_num_rows() > 0</code> → <strong>l'attaquant est connecté en tant qu'administrateur sans connaître aucun mot de passe.</strong></p>
</div>

---
### Solution : Requêtes préparées

.small-code[
```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

// Les ? remplacent les variables — jamais de variables directement !
$sql = "SELECT * FROM utilisateurs WHERE email = ? AND mdp = ?";
$stmt = mysqli_prepare($connexion, $sql);

// Lier les paramètres ("ss" = 2 strings)
mysqli_stmt_bind_param($stmt, "ss", $_POST['email'], $_POST['mdp']);

// Exécuter et récupérer le résultat
mysqli_stmt_execute($stmt);
$resultat = mysqli_stmt_get_result($stmt);

if (mysqli_num_rows($resultat) > 0) {
    echo "Connecté !";
} else {
    echo "Email ou mot de passe incorrect.";
}
?>
```
]

<div class="success-box">
<h4 class="success-title">Pourquoi c'est sécurisé ?</h4>
<p>Les <code>?</code> sont des emplacements réservés. MySQL reçoit la requête et les données <strong>séparément</strong> — les données ne peuvent jamais modifier la structure de la requête.</p>
</div>

### SELECT avec requête préparée<br>/ plusieurs résultats

.small-code[
```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

$categorie = $_GET['categorie'];

// Préparer la requête SELECT
$sql = "SELECT * FROM produits WHERE categorie = ?";
$stmt = mysqli_prepare($connexion, $sql);

// Lier le paramètre (s = string)
mysqli_stmt_bind_param($stmt, "s", $categorie);

mysqli_stmt_execute($stmt);
$resultat = mysqli_stmt_get_result($stmt);

}

mysqli_stmt_close($stmt);
mysqli_close($connexion);
?>

### SELECT avec requête préparée<br>/ un seul résultat

.small-code[
```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

$id = $_GET['id'];

// Préparer la requête SELECT (recherche par clé primaire → 1 seul résultat)
$sql = "SELECT * FROM produits WHERE id = ?";
$stmt = mysqli_prepare($connexion, $sql);

// Lier le paramètre (i = integer)
mysqli_stmt_bind_param($stmt, "i", $id);

// Exécuter et récupérer le résultat
mysqli_stmt_execute($stmt);
$resultat = mysqli_stmt_get_result($stmt);

// Récupérer l'unique ligne directement
$ligne = mysqli_fetch_assoc($resultat);

if ($ligne) {
    echo $ligne['nom'] . " — " . $ligne['prix'] . " €";
} else {
    echo "Produit introuvable.";
}

mysqli_stmt_close($stmt);
mysqli_close($connexion);
?>
```

### INSERT avec requête préparée

.small-code[
```php
<?php
$connexion = mysqli_connect("localhost", "root", "", "boutique");

$nom = "T-shirt";
$prix = 29.99;

// Préparer la requête INSERT

### Se protéger des injections SQL

<div class="step-grid">
<div class="step-card">
<div class="step-number">1</div>
<div class="step-title">Requêtes préparées</div>
<div class="step-desc">Ne jamais insérer de variables directement dans une requête. Utiliser <code>mysqli_prepare()</code> et les placeholders <code>?</code>.</div>
</div>
<div class="step-card">
<div class="step-number">2</div>
<div class="step-title">Valider les données</div>
<div class="step-desc">Vérifier le type et le format des données reçues avant de les utiliser (<code>is_numeric()</code>, <code>filter_var()</code>…).</div>
</div>
<div class="step-card">
<div class="step-number">3</div>
<div class="step-title">Limiter les droits</div>
<div class="step-desc">L'utilisateur MySQL de l'application ne doit avoir que les droits strictement nécessaires (pas de <code>DROP</code>, pas de <code>CREATE</code>…).</div>
</div>
<div class="step-card">
<div class="step-number">4</div>
<div class="step-title">Masquer les erreurs</div>
<div class="step-desc">Ne jamais afficher les erreurs SQL en production — elles donnent des informations précieuses à un attaquant.</div>
</div>
</div>

<div class="success-box">
<h4 class="success-title">La règle d'or</h4>
<p>Ne jamais faire confiance aux données venant de l'utilisateur. Toujours valider, toujours utiliser les requêtes préparées.</p>
</div>

2. **Toujours** utiliser les requêtes préparées avec des données utilisateur
3. **Toujours** fermer les statements avec `mysqli_stmt_close()`
4. **Toujours** fermer la connexion à la fin avec `mysqli_close()`
