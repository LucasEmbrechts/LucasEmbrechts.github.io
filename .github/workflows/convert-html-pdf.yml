name: Convert HTML presentations to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'UAA11/UAA11_*.html'
      - 'UAA12/Theorie/UAA12-*.html'
      - 'UAA14/UAA14-*.html'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert UAA11 HTML presentations to PDF
        run: |
          find UAA11 -maxdepth 1 -name "UAA11_*.html" -print0 | while IFS= read -r -d '' file; do
            abs_file="$(realpath "$file")"
            abs_pdf="${abs_file%.html}.pdf"
            echo "Converting: $file -> $(basename "$abs_pdf")"
            google-chrome-stable \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --print-to-pdf="$abs_pdf" \
              --no-pdf-header-footer \
              "file://$abs_file" || echo "Warning: failed to convert $file"
          done

      - name: Convert UAA12 HTML presentations to PDF
        run: |
          find UAA12/Theorie -maxdepth 1 -name "UAA12-*.html" -print0 | while IFS= read -r -d '' file; do
            abs_file="$(realpath "$file")"
            abs_pdf="${abs_file%.html}.pdf"
            echo "Converting: $file -> $(basename "$abs_pdf")"
            google-chrome-stable \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --print-to-pdf="$abs_pdf" \
              --no-pdf-header-footer \
              "file://$abs_file" || echo "Warning: failed to convert $file"
          done

      - name: Convert UAA14 HTML presentations to PDF (excluding OUT)
        run: |
          find UAA14 -maxdepth 1 -name "UAA14-*.html" ! -name "*-OUT.html" -print0 | while IFS= read -r -d '' file; do
            abs_file="$(realpath "$file")"
            abs_pdf="${abs_file%.html}.pdf"
            echo "Converting: $file -> $(basename "$abs_pdf")"
            google-chrome-stable \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --print-to-pdf="$abs_pdf" \
              --no-pdf-header-footer \
              "file://$abs_file" || echo "Warning: failed to convert $file"
          done

      - name: Commit and push PDFs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          find UAA11 -maxdepth 1 -name "UAA11_*.pdf" -exec git add {} \;
          find UAA12/Theorie -maxdepth 1 -name "UAA12-*.pdf" -exec git add {} \;
          find UAA14 -maxdepth 1 -name "UAA14-*.pdf" -exec git add {} \;

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Automated HTML to PDF conversion - UAA11/UAA12/UAA14 [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
