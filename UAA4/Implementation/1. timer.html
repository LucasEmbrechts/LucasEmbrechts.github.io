<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message après délai</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .message-container {
            background-color: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        #message {
            font-size: 30px;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
            min-height: 50px;
        }

        .info {
            margin-top: 30px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>⏰ Message après délai</h1>

    <div class="message-container">
        <div id="message">Attends 3 secondes...</div>
        <div class="info">Utilise setTimeout pour afficher un message après 3 secondes</div>
    </div>

    <script>
        const messageDisplay = document.getElementById('message');

        // Affiche un message après 3 secondes (3000 ms)
        setTimeout(function() {
            messageDisplay.innerHTML = 'Bonjour ! 👋';
        }, 3000);
    </script>
</body>
</html>
