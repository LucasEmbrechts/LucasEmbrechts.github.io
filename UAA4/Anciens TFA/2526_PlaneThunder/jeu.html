<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E %3Cdefs%3E %3ClinearGradient id='sky' x1='0' y1='0' x2='0' y2='1'%3E %3Cstop offset='0%25' stop-color='%2338bdf8'/%3E %3Cstop offset='100%25' stop-color='%230ea5e9'/%3E %3C/linearGradient%3E %3C/defs%3E %3Crect width='100' height='100' rx='16' fill='url(%23sky)'/%3E %3Ctext y='62' x='50' text-anchor='middle' font-size='52'%3E%E2%9C%88%EF%B8%8F%3C/text%3E %3Ctext y='95' x='72' text-anchor='middle' font-size='38'%3E%E2%9A%A1%3C/text%3E %3C/svg%3E">
    <title>Déplacement au clavier</title>
    <link rel="stylesheet" href="CSS/jeu.css">
</head>
<body>
    <!-- Zone de jeu -->
        <div id="game-container">
            <div id="boxnuage"></div>
            <!-- L'élément à déplacer --><div id="player"></div>
            <img onclick="pause()" id="pause" src="sources/img/Pause-Button-Transparent.png" alt="Pause">
            <div id="fondvie">
                <div id="barrevie">
                    <img id="heart" src="sources/img/heart.png" alt="heart" width="30px">
                </div>
            </div>
            <div id="fondcarburant">
                <div id="barrecarburant">
                    <p>⛽</p>
                </div>
            </div>
            <div id="divscore">
                <p id="score"></p>
            </div>
            <div id="divargenthtml">
                <p id="argenthtml"></p>
            </div>
            <div id="vitesse">
                <p id="vitessep">0km/h</p>
            </div>
            <div id="debug">
                <p id="aviondebug">avion: 0</p>
                <p id="jaugevie">jaugevie: </p>
                <p id="jaugecarburant">jaugecarburant: </p>
                <p id="vitesse_temps">vitesse_temps: </p>
                <p id="vitess_deplac">vitesse_deplac: </p>
                <p id="x_y">x/y: </p>
                <p id="scoredebug">score: </p>
                <p id="argentdebug">argent: </p>
                <p id="multdebug">multiplicateur: </p>
                <p id="Mortdebug">Mort: </p>
                <p id="Pausedebug">Pause: </p>
                <p id="dureetotaldebug">Durée totale: </p>
                <p id="Keydebug">Key: none</p>
                <p id=perte>Perte: </p>
            </div>
            <div id="multiplicateurdiv">
                <p id="multiplicateur">x1</p>
            </div>
        </div>
        <div id="menupause">
            <button onclick="reprendre()" id="reprendre">Reprendre</button>
            <button onclick="rejouer()" id="rejouer">Rejouer</button>
            <button onclick="menuprincipal()" id="menuprincipal">Menu</button>
        </div>
        <div  id="mort">
            <h1>Vous êtes Mort</h1>
            <p id="score-mort"></p>
            <p id="argentfin"></p>
            <p id="argent-mort"></p>
            <button onclick="rejouer()" id="rejouer">Rejouer</button>
            <button onclick="menuprincipal()" id="menuprincipal">Menu</button>
        </div>
    <script src="JS/jeu.js">
    </script>
</body>
</html>
