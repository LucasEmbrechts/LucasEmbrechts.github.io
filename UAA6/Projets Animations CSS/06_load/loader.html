<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Exemple de programme HTML CSS</title>
  <style>
  
  #wrapper{
	width: 700px;
	margin-left: auto;
	margin-right: auto;
  }
.circle {
  border: 5px solid #000;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  transform: translate(-50%, -50%);
  transition: width 0.5s, height 0.5s;
}
.circle:hover {
  width: 60px;
  height: 60px;
}

  </style>
</head>
<body>
<div id="wrapper">
<div class="circle"></div>
</div>
</body>
</html>
