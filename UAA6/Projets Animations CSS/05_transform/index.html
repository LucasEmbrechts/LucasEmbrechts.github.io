<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Exemple de programme HTML CSS</title>
  <style>
	#wrapper{
		width: 700px;
		height: 400px;
		margin-left:auto;
		margin-right:auto;
		border:1px dashed black;
		margin-top: 200px;
	}
    #box {
      width: 100px;
      height: 100px;
      animation-name: move3;
      animation-duration: 3s;
      animation-iteration-count: infinite;
	  /*animation-timing-function: linear;*/
      animation-direction: alternate;
	  background-image: url('geom.png');
	  background-size:cover;
	  background-repeat: no-repeat;
    }
    @keyframes move {
      0% {transform: translate(0, 0);}
      25% {transform: translate(600px, 0);}
      50% {transform: translate(600px, 300px);}
      75% {transform: translate(0, 300px);}
      100% {transform: translate(0, 0);}
    }
	
	
	@keyframes move2 {
      0% {transform: translate(0, 0);}
      25% {transform: translate(600px, 0);}
      50% {transform: translate(0, 300px);}
      75% {transform: translate(600px, 300px);}
	  100% {transform: translate(0, 0);}
    }
	
	@keyframes move3 {
      0% {
		transform: translate(0, 0) rotate(0deg);
	  }
      25% {
		transform: translate(600px, 0) rotate(90deg);
	  }
      50% {
		transform: translate(600px, 300px) rotate(180deg);
	  }
      75% {
		transform: translate(0, 300px) rotate(270deg);
	  }
	  100% {
		transform: translate(0, 0) rotate(360deg);
	  }
    }
  </style>
</head>
<body>
	<div id="wrapper">
	  <div id="box"></div>
	</div>
</body>
</html>
