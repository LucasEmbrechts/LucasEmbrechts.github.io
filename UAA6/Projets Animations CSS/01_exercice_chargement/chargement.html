<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: roboto;
            src: url(Roboto/Roboto-Light.ttf);
        }

        body,
        html {
            height: 100%;
            width: 100%;
        }

        body {
            background: radial-gradient(#2b4b62, #1b2c37);
        }

        #animation {
            width: inherit;
            height: inherit;


            position: absolute;

            animation-name: opac;
            animation-delay: 7s;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-fill-mode: forwards;

        }

        #loadBar {
            position: relative;
            top: 400px;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
            height: 50px;
            border: 1px solid #fff;
            box-sizing: border-box;
            border-radius: 15px;
            overflow: hidden;
        }

        #mana {
            width: 100%;
            height: inherit;
            background-color: blue;
            animation-name: mana;
            animation-delay: Os;
            animation-duration: 5s;
            animation-timing-function: linear;
            background-image: linear-gradient(to right, #088a2e, #c1f33e);
        }

        #message {
            width: 100%;
            text-align: center;
            position: absolute;
            bottom: 10px;
            font-family: roboto;
            font-size: 1.5em;
            animation-name: message;
            animation-delay: Os;
            animation-duration: 0.7s;
            animation-timing-function: linear;
            animation-iteration-count: calc(5 / 0.7);
        }

        @keyframes mana {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes opac {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes message {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="animation">
        <div id="loadBar">
            <div id="mana"></div>
            <div id="message">Loading...</div>
        </div>

    </div>
</body>

</html>
