name: main

# Fonction principale
```
┌─── * Fonction principale
│ instruction1
│ instruction2
│ instruction3
│ ....
└──────────
```

```c
void main(void){

  instruction1
  instruction2
  instruction3
}
```

→ `main` est le **point d'entrée** du programme

→ `instruction1` est la première instruction (le programme commence)

→ `instruction3` est la dernière instruction (le programme termine)

name: commentaires
## Commentaires

### Sur une seule ligne

```c
// Déclaration et affectation en C
int a; // déclaration d'une variable de type entière
a = 3  // affectation
```
### Sur plusieurs lignes
```c
/* 
  Programme calculant 
  la moyenne d'une classe
*/
void main(void)
```

name: impression
## Impression
L'impression sur l'écran se fait via la fonction `printf` ou `printf_s`
```c
#include <stdio.h>

void main(void){
  printf("Bonjour !");
  printf_s("Bonjour !");
}
```

→ `stdio.h` est la librairie standard pour les entrées/sorties

name: variable

## Variables

Exercice : combien y a-t-il de variable ?
```
┌─── * Calcul montant commande
│ obtenir quantite
│ montant = quantite * 2.5
│ sortir montant
└──────────
```
---
## Variables
Une **variable** est une **zone mémoire** qui **stocke de l'information**.

Une variable est **déclarée** en spécifiant :
1. son type
2. son nom
3. sa valeur (via une affectation)

→ la valeur peut être spécifiée en même temps que la déclaration ou après (mais pas avant !).
---
### Déclaration d'une variable : le nom

Le nom d'une variable :
* peut être constitué de lettres, chiffres et/ou _
* commence par une lettre ou _
* est "case sensitive" : distinction entre une minuscule et une majuscule

Bonnes pratiques :
* le nom d'une variable ne commence jamais par une majuscule
* écriture en "camelCase"

Exercices : quels sont les noms corrects/incorrects ?

* `Chif Affaire`
* `_ChifAffaire`
* `1NbEtudiant`
* `chifAffaire1`
* `chifaffaire`
---
### Déclaration d'une variable : le nom
<img style="height:540px;" src="img/case.jpg">
---
### Déclaration d'une variable : le type

En c, il existe 4 grands types, eux-même constitués de variants :

### Le type **entier**
* `short in` ou `short` (2 octets)
* `int` (4 octets)
* `long int` ou `long` (4 octets)

### Le type **réel**
* `float` (4 octets)
* `double` (8 octets)
* `long double` (16 octets)

### Le type **caractère**
* `char` (1 octet)

### Le type **booléen** (dans `stdbool.h`)
* `bool` (`true` / `false`)
---
### Déclaration d'une variable : le type
```c
int nbEtudiants;          // variable de type entier
double pourcentageMoyen;  // variable de type réel
char finPhrase;           // variable de type caractère
bool estComplet;          // variable de type booléen
```
---
name: capacite
### Le type détermine la capacité

Un type, c'est un **nombre d'octets**, donc un **nombre de valeurs possibles**.

| Type | Taille | Valeurs |
| --- | --- | --- |
| `char` | 1 octet | -128 à 127 |
| `short` | 2 octets | -32 768 à 32 767 |
| `int` | 4 octets | -2 147 483 648 à **2 147 483 647** |
| `long long` | 8 octets | environ -9,2·10¹⁸ à 9,2·10¹⁸ |
| `float` | 4 octets | ~7 chiffres significatifs |
| `double` | 8 octets | ~15 chiffres significatifs |

→ Une valeur trop grande pour son type provoque un **dépassement de capacité** : aucune erreur n'est signalée, la valeur "boucle" et devient négative.

→ Un `float` ne stocke pas une valeur exacte : `0.1 + 0.2 != 0.3`. On ne compare **jamais** deux réels avec `==`.
---
name: conversionimpl
### Le type détermine la conversion

Affecter une valeur d'un type à une variable d'un autre type provoque une **conversion implicite**.

| Écriture | Effet |
| --- | --- |
| réel → `int` | la partie décimale est **perdue** (troncature, pas d'arrondi) |
| entier → `float` | conversion sans perte |
| entier → `char` | la variable contient le caractère de ce code ASCII |
| `char` → `int` | la variable contient le code ASCII du caractère |

```c
int   n = 9.99;    // n vaut 9
float x = 4;       // x vaut 4.0
char  c = 65;      // c vaut 'A'
```

→ La troncature ne prévient pas : c'est une erreur de logique classique.

→ `'A'` avec des **apostrophes** est un caractère ; `"A"` avec des **guillemets** est une chaîne. Les deux ne sont pas interchangeables.
---
name: choisirtype
### Choisir le bon type

| J'ai besoin de... | Type |
| --- | --- |
| compter des choses entières | `int` (ou `long` si les valeurs sont grandes) |
| mesurer une grandeur continue | `float` ou `double` |
| stocker **un seul** caractère | `char` |
| répondre par oui ou par non | `bool` (nécessite `stdbool.h`) |

→ Un `int` pour ce qui se **compte**, un réel pour ce qui se **mesure**.

→ Devant chaque déclaration, trois questions :

1. Le type peut-il **contenir** cette valeur ?
2. La valeur est-elle écrite avec la bonne **syntaxe** ?
3. Y a-t-il une **perte** silencieuse ?
---
### Déclaration d'une variable : la valeur

Lorsqu'on "donne" une valeur à une variable, on parle **d'affectation** ou **d'assignation**.
Une affectation/assignation peut se faire :
* en même temps que la déclaration

```c
int nbEtudiants = 20;
double pourcentageMoyen = 0.2;
char finPhrase = 'c';
bool estComplet = false;  
```
* dans la suite du programme

```c
int nbEtudiants;
double pourcentageMoyen;
char finPhrase;
bool estComplet;
nbEtudiants = 20;
pourcentageMoyen = 0.2;
finPhrase = 'c';
estComplet = false; 
```
---
### Déclaration d'une constante

Une **constante** est une variable dont sa **valeur ne peut pas changer** pendant toute l'exécution du programme.

→ on utilise le mot-clé `const`

→ toute affectation après la déclaration sera rejetée par le compilateur.

```c
const int n = 20; // n contient la valeur 20
n = 10;           // erreur !
```

```c
const int n = 20; // n contient la valeur 20
const int n = 10; // erreur !
```
---
name: mathh
### Constantes et fonctions de `<math.h>`

| Élément | Rôle |
| --- | --- |
| `M_PI` | la constante π |
| `sqrt(x)` | racine carrée de x |
| `pow(x, n)` | x élevé à la puissance n |
| `fabs(x)` | valeur absolue d'un réel |

```c
#include <math.h>
```

**Pourquoi une constante plutôt qu'une variable ?**

→ Elle ne peut pas être modifiée par erreur au milieu du programme.

→ Elle porte un **nom** : `M_PI` se relit mieux que `3.14159265`.

→ Elle se corrige **en un seul endroit** (un taux, un prix, un seuil).
---
### Affectation

Une affectation a toujours la forme `maVariable = monExpression`

Une expression peut prendre plusieurs formes :

* une valeur

```c
int maVariable = 1;
```

* une opération

```c
int maVariable = 10 + 15;
```

* une variable

```c
int maVariable = 1;
int monAutreVariable = 2;

maVariable = monAutreVariable;
maVariable = monAutreVariable + 5;

```

name: largeur
## Largeur, précision et alignement

Entre le `%` et la lettre du type, on précise **comment** afficher.

```
%  -   8   .2   f
│  │   │    │   └── le type
│  │   │    └────── précision : 2 décimales
│  │   └─────────── largeur minimale : 8 caractères
│  └─────────────── alignement à gauche (par défaut : à droite)
└────────────────── début du code de formatage
```

| Écriture | Effet |
| --- | --- |
| `%8.2f` | largeur 8, 2 décimales, aligné à droite |
| `%-8.2f` | largeur 8, 2 décimales, aligné à gauche |
| `%05d` | largeur 5, complétée par des **zéros** |
| `%f` | 6 décimales par défaut |
| `%5c` | un caractère, précédé de 4 espaces |
---
### Largeur et précision : ce qu'il faut retenir

→ La largeur est un **minimum** : une valeur plus longue n'est jamais tronquée.

→ La précision **arrondit** à l'affichage ; elle ne modifie pas la variable.

→ Une largeur identique sur plusieurs lignes **aligne les valeurs verticalement** : c'est ainsi qu'on obtient un tableau propre en console.

→ La précision n'a de sens que pour les réels. Pour un entier, `%.2d` fixe un nombre minimal de **chiffres**, pas de décimales.
---
name: echappement
## Les caractères d'échappement

Certains caractères ne peuvent pas s'écrire tels quels dans une chaîne.

| Je veux afficher | J'écris | Pourquoi |
| --- | --- | --- |
| un retour à la ligne | `\n` | |
| une tabulation | `\t` | |
| un guillemet | `\"` | seul, il fermerait la chaîne |
| une barre oblique inverse | `\\` | seule, elle annonce un caractère spécial |
| un pourcent | `%%` | seul, il annonce un code de formatage |

→ Ces séquences comptent pour **un seul** caractère.

→ `printf` lit la chaîne de gauche à droite : tout `%` non doublé est interprété comme le début d'un code de formatage, même s'il n'y a plus d'argument.
---
name: printfregles
## `printf` : les trois règles

1. **Un code de formatage = un argument**, dans le même ordre.
2. Le code doit correspondre **exactement** au type de la variable.
3. Une **virgule** sépare la chaîne de chaque argument.

| Erreur | Conséquence |
| --- | --- |
| mauvais code (`%d` pour un `float`) | avertissement, affichage aberrant |
| plus de codes que d'arguments | affichage d'une valeur imprévisible |
| `%s` pour un `char` | le programme peut planter |
| virgule oubliée | erreur de compilation |
| variable non déclarée | erreur de compilation |

→ Seules les deux dernières lignes sont refusées par le compilateur. Les trois premières produisent un programme qui se lance et affiche n'importe quoi.
---
name: operateurs
## Opérateurs
### Opérateurs arithmétiques

* Addition : `+`

```c
int maVariable;
int monAutreVariable = 2;

maVariable = monAutreVariable + 5;
```

* Soustraction : `-`

```c
int maVariable = 1 - 2;
```

* Multiplication : `*`

```c
int maVariable;
int monAutreVariable = 2;

maVariable = monAutreVariable * 2;
```
---
### Opérateurs arithmétiques

* Division : `/`

```c
int maVariable;
int monAutreVariable = 2;

maVariable = monAutreVariable / 2;
```

* Modulo (reste de la division d'un entier par un entier) : `%`

```c
int nombre = 15;
int reste;

reste = 15 % 2; // reste contient la valeur 1
reste = 15 % 3; // reste contient la valeur 0
reste = 15 % 4; // reste contient la valeur 3
```
---
name: composee
### Affectation composée

Ces écritures sont des **raccourcis**, pas de nouvelles opérations.

| Écriture | Équivaut à |
| --- | --- |
| `a += 3` | `a = a + 3` |
| `a -= 3` | `a = a - 3` |
| `a *= 3` | `a = a * 3` |
| `a /= 3` | `a = a / 3` |
| `a %= 3` | `a = a % 3` |

→ Le type des opérandes décide du résultat, exactement comme pour l'opération complète.

```c
float x = 7;   x /= 2;   // x = 3.5
int   y = 7;   y /= 2;   // y = 3
```
---
### Type des variables en cas de division

Quelle sera la sortie ?

```c
int nb1, nb2, resultatDivisionEntiere;
double resultatDivisionReelle;

nb1 = 100;
nb2 = 30;

resultatDivisionReelle = nb1/nb2;
printf("%lf",resultatDivisionReelle);
```
---
name: conversion
### Type des variables en cas de division

En C, l'opérateur de division appliqué à **deux entiers** exécute la **division entière**.

```c
float a = 1 / 3;         // a contient 0
```

Pour obtenir un résultat réel, il faut qu'**au moins un** des deux opérandes soit réel :

```c
float a = (float) 1 / 3;   // casting : a contient 0.33333...
float a = 1.0 / 3;         // réel explicite : a contient 0.33333...
```

→ La conversion doit avoir lieu **avant** la division. Ceci ne corrige rien :

```c
float a = (float)(1 / 3);   // la division entière a déjà eu lieu : a contient 0
```

→ Le casting `(int)` **tronque**, il n'arrondit pas : `(int)5.9` vaut 5.
---
### Incrémentation

* Post-incrémentation 

```c
int n = 1;
n++;
```
* Pré-incrémentation

```c
int n = 1;
++n;
```

Quelle sera la sortie ?

```c
int nombre = 10;
int nombrePlusUn;
```
```c
nombrePlusUn = ++nombre;
printf("nombre : %d\nnombrePlusUn :%d\n", nombre, nombrePlusUn);
```
```c
nombrePlusUn = nombre++;
printf("nombre : %d\nnombrePlusUn :%d\n", nombre, nombrePlusUn);
```
---
### Décrémentation

* Post-décrémentation 

```c
int n = 1;
n--;
```
* Pré-décrémentation

```c
int n = 1;
--n;
```

Quelle sera la sortie ?

```c
int nombre = 10;
int nombreMoinsUn;
```
```c
nombreMoinsUn = --nombre;
printf("nombre : %d\nnombreMoinsUn :%d\n", nombre, nombreMoinsUn);
```
```c
nombreMoinsUn = nombre--;
printf("nombre : %d\nnombreMoinsUn :%d\n", nombre, nombreMoinsUn);
```
---

Du plus prioritaire au moins prioritaire :

<tr><td>3</td><td><code>*</code>, <code>/</code>, <code>%</code></td></tr>
<tr><td>4</td><td><code>+</code>, <code>-</code></td></tr>

<tr><td>7</td><td><code>&amp;&amp;</code></td></tr>
<tr><td>8</td><td><code>||</code></td></tr>
<tr><td>9</td><td><code>=</code>, <code>+=</code>, <code>-=</code>, <code>*=</code>, <code>/=</code>, <code>%=</code></td></tr>

→ À priorité égale, l'évaluation se fait **de gauche à droite**.

→ En cas de doute : **des parenthèses**. Elles ne coûtent rien et se relisent.
---
name: charentier
### Un caractère est un entier

Un `char` contient le **code ASCII** du caractère. Les opérateurs arithmétiques s'y appliquent donc.

```c
char c = 'A';
printf("%c", c);   // A
printf("%d", c);   // 65
```

| Plage | Codes |
| --- | --- |
| `'0'` ... `'9'` | 48 ... 57 |
| `'A'` ... `'Z'` | 65 ... 90 |
| `'a'` ... `'z'` | 97 ... 122 |

→ Une opération sur un `char` produit un **`int`** : `'A' + 1` vaut 66, et s'affiche `B` avec `%c`.

→ Ce sujet est développé dans le module **02 - les caractères**.
---
name: lecture
## Lecture

La lecture se fait via le clavier en utilisant la fonction `scanf` ou `scanf_s` qui se trouvent dans la librairie `stdio.h`.

```c
int nbEtudiants;
scanf_s("%d", &nbEtudiants);
```

```c
int nbEtudiants;
printf("Entrez le nombre d'inscrits : ");
scanf_s("%d", &nbEtudiants);
```

```c
int abscisse, ordonnee;
printf("Entrez les coordonnées (x,y) :");
scanf_s("(%d,%d)", &abscisse, &ordonnee);
```

→ Ne pas oublier l'opérateur d'adressage `&` !
---
name: scanfregles
## `scanf` : les trois règles

1. **Toujours** l'opérateur d'adressage `&` devant la variable (sauf pour un tableau).
2. Le code de formatage doit correspondre **exactement** au type de la variable.
3. Autant de codes que de variables, dans le **même ordre**.

```c
int a; float b;
scanf("%d %f", &a, &b);
```

```c
char c;
scanf(" %c", &c);       // l'espace avant %c ignore les blancs en attente
```

→ Une erreur de `&` ou de code de formatage ne se voit **pas** à la compilation : le programme plante ou lit n'importe quoi.

→ L'espace avant `%c` évite le problème du **tampon**, développé dans le module 02.
