name: codification
## Codification d'un caractère

```c
void main(void) {
	char c;
	printf("Entrez un caractere :");
	scanf_s("%c", &c, 1);

	printf("\nCaractere %c", c);
	printf("\nCode ASCII : %d", c);
	printf("\nHexa : %X", c);
}
```
---
name: ascii
## Un caractère est un entier

Un `char` occupe **1 octet**. Ce qu'il contient n'est pas une lettre : c'est un **nombre**, le **code ASCII** de cette lettre.

```c
char c = 'A';
printf("%c\n", c);   // A    ← on demande d'afficher le caractère
printf("%d\n", c);   // 65   ← on demande d'afficher le nombre
printf("%X\n", c);   // 41   ← le même nombre, en hexadécimal
```

→ `%c` et `%d` affichent **la même variable** de deux façons différentes.

Les trois plages à retenir :

| Plage | Premier | Dernier | Remarque |
| --- | --- | --- | --- |
| chiffres `'0'` → `'9'` | 48 | 57 | contigus |
| majuscules `'A'` → `'Z'` | 65 | 90 | contiguës |
| minuscules `'a'` → `'z'` | 97 | 122 | contiguës |

→ L'écart entre une majuscule et sa minuscule est **toujours 32** : `'a' - 'A' == 32`. Le caractère `'0'` (code 48) n'est **pas** le nombre `0`.

name: arith
## Arithmétique sur les codes ASCII

Puisqu'un caractère est un entier, on peut **calculer** avec.

```c
char c = 'A';

char suivant   = c + 1;    // 'B'
char precedent = c - 1;    // '@'
char minuscule = c + 32;   // 'a'
char majuscule = 'a' - 32; // 'A'

int ecart      = 'z' - 'a';   // 25 : il y a 26 lettres, donc 25 d'écart
int rang       = c - 'A';     // 0  : A est la 1re lettre (rang 0)
int valeur     = '7' - '0';   // 7  : du caractère au nombre qu'il représente
char chiffre   = 3 + '0';     // '3' : du nombre au caractère
```

→ `c + 1` est un **`int`** : pour le réafficher comme un caractère, il faut `%c` ou un `(char)`.

```c
printf("%d\n", 'A' + 1);          // 66
printf("%c\n", 'A' + 1);          // B
printf("%c\n", (char)('A' + 1));  // B
```

## Exercice : majuscule vers minuscule

Demandez une lettre **majuscule** et affichez la minuscule correspondante, **sans `<ctype.h>`**. Affichez aussi le caractère précédent et le suivant.

```c
#include <stdio.h>

void main(void){
  char c;

  printf("Entrez une lettre majuscule : ");
  scanf(" %c", &c);

  printf("Minuscule  : %c\n", c + 32);
  printf("Precedent  : %c\n", c - 1);
  printf("Suivant    : %c\n", c + 1);
}
```

→ Que se passe-t-il si l'utilisateur entre `'A'` ? Et `'Z'` ? Le programme sort de la plage des lettres : c'est à vous de le vérifier avec une condition.

→ `" %c"` (avec un espace) : l'espace demande à `scanf` d'ignorer les blancs en attente, dont le `\n` de la saisie précédente.

name: lecture
## Lecture d'un caractère

Lire un caractère peut se faire de deux manières différentes.

### Avec `scanf_s`

```c
void main(void) {
	char c;
	printf("Entrez un caractere :");
	scanf_s("%c", &c, 1);
```

### Avec `getchar`
```c
void main(void) {
	char c;
	printf("Entrez un caractere :");
	c = getchar();
```

name: tampon
## Le problème du tampon (buffer)

Lors d'une lecture via `scanf_s`, l'entièreté des caractères entrés sur la console est enregistrée : lorsque l'utilisateur appuie sur ENTER, le saut de ligne `\n` est enregistré lui aussi.

Après chaque `scanf_s` il reste donc un caractère à lire dans le tampon, et le `scanf` suivant l'utilisera comme caractère à lire !

```c
void main (void){
  char reponse;
  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse, 1);
  printf("Vous avez entré %c\n", reponse);
  
  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse,1);
  printf("Vous avez entré %c\n", reponse);
  
  printf("Une ligne vide est apparue comme par magie !");
}

```
---
## Le problème du tampon (buffer)
Pour résoudre ce problème, il suffit de "vider" le tampon en lisant tous les caractères restant.

```c
void main (void){
  char reponse;
  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse,1);

  // ici, le buffer contient un \n

  printf("Vous avez entré %c\n", reponse);
  
  viderTampon(); // on vide le tampon : le \n disparaît du buffer

  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse, 1);
  printf("Vous avez entré %c\n", reponse);
  
  printf("La ligne vide a disparu !");
}
```
---
## Le problème du tampon (buffer)

```c
void viderTampon(void)
{
	int c;
	do
	{
		c = getchar();
	} while (c != '\n' && c != EOF);
}
```

name: impression
## Impression d'un caractère

L'impression d'un caractère peut se faire de deux manières différentes.
### Avec `printf`

```c
char c;
printf("Entrez un caractère :\n");
scanf_s("%c", &c, 1);
printf("Le caractère entré est %c\n", c);
```
### Avec `putchar`

```c
char c;
printf("Entrez un caractère :\n");
scanf_s("%c", &c, 1);   // ou c = getchar();
printf("Le caractère entré est : ");
putchar(c);             // imprime c ET passe à la ligne
```

name: classer
## Classer un caractère sans librairie

Puisque les trois plages sont **contiguës**, un simple encadrement suffit.

```c
char c;
printf("Entrez un caractere : ");
scanf(" %c", &c);

if(c >= 'A' && c <= 'Z'){
  printf("Lettre majuscule");
} else if(c >= 'a' && c <= 'z'){
  printf("Lettre minuscule");
} else if(c >= '0' && c <= '9'){
  printf("Chiffre");
} else {
  printf("Autre symbole");
}
```
---
### Comparer des caractères

→ On écrit `c >= 'A' && c <= 'Z'` et **jamais** `'A' <= c <= 'Z'` : en C, cette seconde écriture compile mais ne teste pas ce que vous croyez.

→ Comparer deux caractères, c'est comparer leurs **codes ASCII**. `'B' > 'A'` est donc vrai, et `'a' > 'Z'` aussi, puisque 97 > 90.

→ Trois caractères sont **dans l'ordre alphabétique** si :

```c
if(c1 <= c2 && c2 <= c3){
  printf("Les caracteres sont ranges dans l'ordre alphabetique");
} else {
  printf("Les caracteres ne sont pas ranges");
}
```

→ Attention : cet ordre est celui de la table ASCII. `'Z'` y précède `'a'`, ce qui n'est pas l'ordre d'un dictionnaire.

name: fonctions
## Fonctions

En C, il existe un grand nombre de fonctions prédéfinies pouvant être utilisées avec des caractères.

### Fonctions de vérifications (`ctype.h`)

* `isalnum` : vérifie si un caractère est alphanumérique
* `isalpha` : vérifie si un caractère est une lettre de l'alphabet
* `isdigit` : vérifie si un caractère est un chiffre
* `islower` : vérifie si le caractère est une lettre de l'alphabet en minuscule
* `isupper` : vérifie si le caractère est une lettre de l'alphabet en majuscule
* `isspace` : vérifie si le caractère est un espace
* `isxdigit` : vérifie si le caractère fait partie du système hexadécimal
---
### Fonctions de transformation (`ctype.h`)

* `tolower` : transforme le caractère en minuscule
* `toupper` : transforme le caractère en majuscule

Que fait le code suivant ?

```c
char c;

printf("Entrez un caractère : ");
c = getchar();
printf("Caractère transformé : ");
putchar(toupper(++c));
```

## Exercice : code ASCII et hexadécimal

Demandez un caractère et affichez son code ASCII et son code hexadécimal, sous la forme :

```
caractere A		code ASCII = 65		hexadecimal = 41
```

```c
#include <stdio.h>

void main(void){
  char c;

  printf("Entrez un caractere : ");
  scanf(" %c", &c);

  printf("caractere %c\t\tcode ASCII = %d\t\thexadecimal = %X\n", c, c, c);
}
```

→ `\t` produit la tabulation qui aligne les trois colonnes.

→ La **même variable** `c` est passée trois fois, avec trois codes de formatage différents.
