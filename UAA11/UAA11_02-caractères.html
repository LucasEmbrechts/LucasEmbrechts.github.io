name: codification
## Codification d'un caractère

Une même variable `char` s'affiche de trois façons, selon le code de formatage :

| Code | Ce qui est affiché |
| --- | --- |
| `%c` | le caractère |
| `%d` | son code ASCII, en décimal |
| `%X` | son code ASCII, en hexadécimal |

```c
char c = 'A';
printf("%c", c);   // A
printf("%d", c);   // 65
printf("%X", c);   // 41
```

→ La variable ne change pas : c'est la **façon de la lire** qui change.
---
name: ascii
## Un caractère est un entier

Un `char` occupe **1 octet**. Ce qu'il contient n'est pas une lettre : c'est un **nombre**, le **code ASCII** de cette lettre.

Les trois plages à retenir :

| Plage | Premier | Dernier | Remarque |
| --- | --- | --- | --- |
| chiffres `'0'` → `'9'` | 48 | 57 | contigus |
| majuscules `'A'` → `'Z'` | 65 | 90 | contiguës |
| minuscules `'a'` → `'z'` | 97 | 122 | contiguës |

→ Les codes d'une même plage se suivent **sans trou** : c'est ce qui rend le calcul possible.

→ L'écart entre une majuscule et sa minuscule est **toujours 32**. Le caractère `'0'` (code 48) n'est **pas** le nombre `0`.

name: arith
## Arithmétique sur les codes ASCII

Puisqu'un caractère est un entier, les opérateurs arithmétiques s'y appliquent.

| Écriture | Résultat | Type |
| --- | --- | --- |
| `c + 1` | le caractère suivant dans la table | `int` |
| `c - 1` | le caractère précédent | `int` |
| `c + 32` | la minuscule, si `c` est une majuscule | `int` |
| `c - 32` | la majuscule, si `c` est une minuscule | `int` |
| `c - 'A'` | le rang de `c` dans l'alphabet, à partir de 0 | `int` |
| `c - '0'` | le nombre que représente le chiffre `c` | `int` |
| `'z' - 'a'` | l'écart entre deux caractères | `int` |

→ Le résultat est un **`int`**, pas un `char` : pour le réafficher comme un caractère, il faut `%c` ou une conversion `(char)`.

```c
printf("%d", 'A' + 1);   // 66
printf("%c", 'A' + 1);   // B
```

name: lecture
## Lecture d'un caractère

Lire un caractère peut se faire de deux manières différentes.

### Avec `scanf_s`

```c
void main(void) {
	char c;
	printf("Entrez un caractere :");
	scanf_s("%c", &c, 1);
```

### Avec `getchar`
```c
void main(void) {
	char c;
	printf("Entrez un caractere :");
	c = getchar();
```

name: tampon
## Le problème du tampon (buffer)

Lors d'une lecture via `scanf_s`, l'entièreté des caractères entrés sur la console est enregistrée : lorsque l'utilisateur appuie sur ENTER, le saut de ligne `\n` est enregistré lui aussi.

Après chaque `scanf_s` il reste donc un caractère à lire dans le tampon, et le `scanf` suivant l'utilisera comme caractère à lire !

```c
void main (void){
  char reponse;
  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse, 1);
  printf("Vous avez entré %c\n", reponse);
  
  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse,1);
  printf("Vous avez entré %c\n", reponse);
  
  printf("Une ligne vide est apparue comme par magie !");
}

```
---
## Le problème du tampon (buffer)
Pour résoudre ce problème, il suffit de "vider" le tampon en lisant tous les caractères restant.

```c
void main (void){
  char reponse;
  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse,1);

  // ici, le buffer contient un \n

  printf("Vous avez entré %c\n", reponse);
  
  viderTampon(); // on vide le tampon : le \n disparaît du buffer

  printf("Entrez un caractère :\n");
  scanf_s("%c", &reponse, 1);
  printf("Vous avez entré %c\n", reponse);
  
  printf("La ligne vide a disparu !");
}
```
---
## Le problème du tampon (buffer)

```c
void viderTampon(void)
{
	int c;
	do
	{
		c = getchar();
	} while (c != '\n' && c != EOF);
}
```

name: impression
## Impression d'un caractère

L'impression d'un caractère peut se faire de deux manières différentes.
### Avec `printf`

```c
char c;
printf("Entrez un caractère :\n");
scanf_s("%c", &c, 1);
printf("Le caractère entré est %c\n", c);
```
### Avec `putchar`

```c
char c;
printf("Entrez un caractère :\n");
scanf_s("%c", &c, 1);   // ou c = getchar();
printf("Le caractère entré est : ");
putchar(c);             // imprime c ET passe à la ligne
```

name: comparer
## Comparer des caractères

Comparer deux caractères, c'est comparer leurs **codes ASCII**.

```c
'B' > 'A'     // vrai : 66 > 65
'a' > 'Z'     // vrai : 97 > 90
```

Pour tester l'appartenance à une plage, on **encadre des deux côtés** :

```c
c >= 'A' && c <= 'Z'     // c est une majuscule
c >= 'a' && c <= 'z'     // c est une minuscule
c >= '0' && c <= '9'     // c est un chiffre
```

→ On n'écrit **jamais** `'A' <= c <= 'Z'` : cette écriture compile, mais C évalue `'A' <= c` (qui vaut 0 ou 1), puis compare ce 0 ou 1 à `'Z'`. La condition est alors toujours vraie.

→ L'ordre obtenu est celui de la **table ASCII**, où `'Z'` précède `'a'`. Ce n'est pas l'ordre d'un dictionnaire.

name: fonctions
## Fonctions

En C, il existe un grand nombre de fonctions prédéfinies pouvant être utilisées avec des caractères.

### Fonctions de vérifications (`ctype.h`)

* `isalnum` : vérifie si un caractère est alphanumérique
* `isalpha` : vérifie si un caractère est une lettre de l'alphabet
* `isdigit` : vérifie si un caractère est un chiffre
* `islower` : vérifie si le caractère est une lettre de l'alphabet en minuscule
* `isupper` : vérifie si le caractère est une lettre de l'alphabet en majuscule
* `isspace` : vérifie si le caractère est un espace
* `isxdigit` : vérifie si le caractère fait partie du système hexadécimal
---
### Fonctions de transformation (`ctype.h`)

* `tolower` : transforme le caractère en minuscule
* `toupper` : transforme le caractère en majuscule

Que fait le code suivant ?

```c
char c;

printf("Entrez un caractère : ");
c = getchar();
printf("Caractère transformé : ");
putchar(toupper(++c));
```
