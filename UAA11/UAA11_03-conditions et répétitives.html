name: alternatives
## Alternatives
### Pourquoi utiliser des alternatives ?

Les alternatives permettent de faire réagir différemment un programme en fonction des entrées qui lui sont données.

Objectif : transcrire le diagramme suivant en C.

```da
┌─── * Calcul prix entrée
│ Obtenir age
│┌── if(age >= 18)
││ prix = 10
│├── else
││┌── if(age < 12)
│││ prix = 0
││├── else
│││ prix = 5.5
││└──────────
│└──────────
│ Sortir prix
└──────────
```
---
name: operateurs
## Opérateurs

### Opérateurs de comparaison

* plus grand : `>`
* plus petit : `<`
* plus grand ou égal : `>=`
* plus petit ou égal : `<=`
* égal : `==`
* différent : `!=`

→ quelle est la différence entre `a = 3` et `a == 3` ?

### Opérateurs logiques

* ET : `&&`
* OU : `||`
* Négation : `!`
---
### Exemple

```c
if(nbVies == 0){
  estMort = true;
} else {
  estMort = false;
}

if(estMort && !peutRessusciter){
  // Ici, estMort = true et peutRessusciter = false
  printf("Perdu !");
} else {
  // Ici, estMort = false ou peutRessusciter = true (ou les deux)
  if(peutRessusciter){
    nbVies = 5;
  }
  printf("La partie continue ! Il vous reste %d vies", nbVies);
}
```
---
### Les erreurs à éviter

* Utiliser `==` ou `!=` avec une variable booléenne
```c
if(estMort == true && peutRessusciter != true){
  ...
}
```

* Confondre affectation et comparaison
```c
if(nbVies = 0){
  ...
}
```

→ !! pas d'erreur lors de la compilation !!
---
name: pseudo
## Du pseudo-code au C

La traduction d'un diagramme d'action est **mécanique** :

| Pseudo-code | C |
| --- | --- |
| `if (condition)` | `if(condition){ ... }` |
| `else` | `} else { ... }` |
| `AND` | `&&` |
| `OR` | `||` |
| `NOT x` | `!x` |
| `a = b` (test) | `a == b` |
| `a ← b` (affectation) | `a = b;` |
| `≥` `≤` `≠` | `>=` `<=` `!=` |
| `sortir "texte"` | `printf("texte");` |
| `obtenir x` | `scanf("%d", &x);` |

→ Le piège numéro un : traduire le `=` du pseudo-code par un `=` en C alors qu'il s'agit d'un **test**.

→ Une branche `else` peut ne contenir **qu'un seul `if`**, sans `else`. C'est légal.
---
name: intervalles
### Tester un intervalle

Pour dire « x compris entre 10 et 20 » :

```c
if(x >= 10 && x <= 20){ ... }     // CORRECT
if(10 <= x <= 20){ ... }          // COMPILE, mais FAUX
```

Pourquoi la seconde est-elle fausse ? C évalue de gauche à droite :

→ `10 <= x` vaut `1` (vrai) ou `0` (faux)

→ puis il teste `1 <= 20`, ce qui est **toujours vrai**

→ la condition est donc vraie quelle que soit la valeur de `x`.

→ Un intervalle se teste **toujours** avec deux comparaisons reliées par `&&`.
---
### Nier une condition composée

Les **lois de De Morgan** permettent de passer d'une condition à son contraire.

<table>
<thead><tr><th>Condition</th><th>Sa négation</th></tr></thead>
<tbody>
<tr><td><code>a &amp;&amp; b</code></td><td><code>!a || !b</code></td></tr>
<tr><td><code>a || b</code></td><td><code>!a &amp;&amp; !b</code></td></tr>
<tr><td><code>x == 5</code></td><td><code>x != 5</code></td></tr>
<tr><td><code>x &gt;= 10</code></td><td><code>x &lt; 10</code></td></tr>
<tr><td><code>x &gt; 10 &amp;&amp; x &lt; 20</code></td><td><code>x &lt;= 10 || x &gt;= 20</code></td></tr>
</tbody>
</table>

→ On inverse **chaque** comparaison **et** on échange `&&` et `||`. Oublier l'un des deux est l'erreur classique.

→ Ce réflexe sert dès qu'il faut écrire « je continue **tant que** ce n'est pas valide ».
---
### Exercice

Créez un programme qui prend en entrée deux entiers (a et b) et qui affiche le message :

* "le produit est positif" si le produit de a et b est positif
* "le produit est négatif" si le produit de a et b est négatif
* "le produit est nul" si le produit de a et b est nul

name: cascade
## Les cascades `else if`

Quand plusieurs cas s'excluent, on les enchaîne :

```c
if(condition1){
  // cas 1
} else if(condition2){
  // cas 2
} else if(condition3){
  // cas 3
} else {
  // tous les autres cas
}
```

→ Les conditions sont évaluées **dans l'ordre**, et l'exécution s'arrête à la **première** qui est vraie.

→ Grâce au `else`, arriver sur `condition2` signifie que `condition1` était fausse : **inutile de la retester**.

→ Le `else` final est facultatif, mais il garantit qu'**un** cas au moins est traité.
---
### Cascade ou `if` indépendants ?

```c
if(condition1){ ... }
if(condition2){ ... }
if(condition3){ ... }
```

→ Sans `else`, **tous** les tests sont évalués, et plusieurs peuvent être vrais en même temps : plusieurs blocs s'exécutent.

→ Pour rendre des `if` indépendants équivalents à une cascade, il faut **fermer chaque intervalle des deux côtés** :

```c
if(x >= 10 && x < 20){ ... }
```

| | cascade `else if` | `if` indépendants |
| --- | --- | --- |
| Tests évalués | jusqu'au premier vrai | tous |
| Blocs exécutés | un seul | zéro, un ou plusieurs |
| Conditions à écrire | une borne suffit | les deux bornes |
---
name: simplifications
## Simplifications

Dans certains cas, pour rendre le code plus concis (et donc facile à lire), on utilise l'alternative simplifiée.

```c
// ? signifie "alors"
// : signifie "sinon"

bool max = (nbr1 <= nbr2) ? nbr2 : nbr1;
bool estPair = (mois % 2 == 0) ? true : false;
```
---
name: switch
## Switch

Le `switch` permet d'effectuer une série de test d'égalité sur une variable spécifique.

Par exemple, le code suivant :
```c
char codeSexe = 'f';
if(codeSexe == 'f'){
  printf("Bonjour madame\n");
} else {
  if(codeSexe == 'h'){
    printf("Bonjour monsieur\n");
  } else {
    printf("Bonjour\n");
  }
}
```
---
## Switch

Le `switch` permet d'effectuer une série de test d'égalité sur une variable spécifique.

Devient :
```c
char codeSexe = 'f';
switch(codeSexe){
  case 'f' : printf("Bonjour madame\n");
    break;
  case 'h' : printf("Bonjour monsieur\n");
    break;
  default: printf("Bonjour\n");
  }
}
```
---
name: fallthrough
## `switch` : cases groupés et `break`

Sans `break`, l'exécution **continue dans les cases suivants**. Ce n'est pas un bug : c'est un outil.

```c
switch(variable){
  case 1:
  case 2:
  case 3:
    // bloc commun aux valeurs 1, 2 et 3
    break;
  case 4:
    // bloc propre à la valeur 4
    break;
  default:
    // tous les autres cas
}
```
---
### Le rôle exact du `break`

→ Plusieurs `case` peuvent partager **un seul** bloc d'instructions : c'est le *fall-through*.

→ Un `case` avec des instructions et **sans** `break` enchaîne sur le suivant : c'est l'oubli le plus fréquent.

→ Si l'on supprimait **tous** les `break`, la première valeur reconnue déclencherait l'exécution de tous les blocs jusqu'à la fin du `switch`.

→ Le `default` joue le rôle du dernier `else` : il attrape tout ce qui n'a pas été prévu. Il est facultatif, mais on le met presque toujours.

→ Le dernier bloc n'a pas besoin de `break`, mais on l'écrit quand même : cela évite un oubli le jour où l'on ajoute un `case`.
---
name: limites
### Les limites du `switch`

Le `switch` ne sait faire qu'une chose : comparer une variable à des **valeurs constantes**, avec `==`.

```c
switch(x){
  case x >= 50:     // IMPOSSIBLE : pas de condition dans un case
  case 50 ... 64:   // IMPOSSIBLE : pas d'intervalle
}
```

| Le `switch` accepte | Le `switch` refuse |
| --- | --- |
| un `int`, un `char` | un `float`, un `double` |
| une valeur constante par `case` | un intervalle, une comparaison |
| plusieurs `case` groupés | une variable dans le `case` |

→ Choisir parmi des valeurs distinctes (un numéro de menu, un code) : `switch`.

→ Comparer deux grandeurs, tester un intervalle : `if`.
---
name: repetitives
## Répétitives
### Pourquoi utiliser des répétitives ?

Une répétitive permet de répéter l'exécution d'un bloc un certains nombre de fois en fonction d'une condition logique.

Objectif : traduire le diagramme d'action suivant.

```da
┌─── * Salutation
│ Obtenir nbSalutations
│ n = 0;
│ 
│╔══ while(n < nbSalutations)
│║ Sortir "Hey, salut toi !"
│║ n++
│└──────────
└──────────
```
---
### Les différentes répétitives

* l'instruction `while`

```c
int nombre = -10;
while(nombre < 0){
  nombre += 2;
}
```

* l'instruction `do ... while`

```c
int nombre = -10;
do{
  nombre += 2;
} while (nombre < 0)
```

* l'instruction `for`

```c
for(int cpt = 0; cpt < 10; cpt++){
  printf("Je suis déjà passé %d fois ici\n", cpt + 1);
}
```
---
name: comparatif
### `while`, `do…while`, `for` : le tableau comparatif

| | `while` | `do…while` | `for` |
| --- | --- | --- | --- |
| Le test a lieu... | **avant** le corps | **après** le corps | **avant** le corps |
| Nb minimal d'exécutions | 0 | **1** | 0 |
| Le compteur est déclaré... | avant la boucle | avant la boucle | **dans** la boucle |
| La plus adaptée quand... | le nombre de tours est inconnu | il faut agir **au moins une fois** | le nombre de tours est **connu** |

→ `do…while` se termine par un `;` après la parenthèse ; les deux autres, non.

→ Le compteur d'un `for` **n'existe plus** après la boucle.

→ La question à se poser : **« est-ce que je connais d'avance le nombre de tours ? »** Si oui → `for`. Si non → `while`, sauf s'il faut agir au moins une fois → `do…while`.

→ Les trois formes sont **interchangeables** : toute boucle peut s'écrire avec n'importe laquelle des trois.
---
name: compter
### Compter les tours d'une boucle

```c
for(int i = debut; i < fin; i++)
```

| Condition | Nombre de tours | Valeur finale du compteur |
| --- | --- | --- |
| `i < n` (depuis 0) | n | n |
| `i <= n` (depuis 1) | n | n + 1 |
| `i < n` avec `i += p` | n / p arrondi au supérieur | premier multiple ≥ n |
| `i > 0` avec `i--` (depuis n) | n | 0 |
| condition fausse d'emblée | **0** | valeur initiale |

→ `i < n` donne **n** tours ; `i <= n` en donne **n + 1**. C'est l'erreur « à un près » (*off-by-one*).

→ À la sortie, le compteur vaut **la première valeur qui a fait échouer le test**, pas la dernière valeur utilisée.
---
name: pieges
### Les pièges classiques

| Le piège | La conséquence |
| --- | --- |
| le compteur n'est jamais modifié dans le corps | boucle infinie |
| un `;` placé juste après `for(...)` ou `while(...)` | le corps est vide, la boucle tourne à vide |
| `!=` comme condition, avec un pas qui saute la cible | boucle infinie |
| `!=` ou `==` sur un **réel** | boucle infinie : `0.1` n'est pas exact |
| accumulateur non initialisé | résultat imprévisible |
| calcul final placé **dans** la boucle | affichage répété, division par zéro au 1er tour |
| condition de `do…while` inversée | on continue tant que c'est **valide** |

→ Règle : dans une condition de boucle, préférez `<` et `>` à `==` et `!=`.

→ Ne comparez **jamais** deux réels avec `==` ou `!=`.

→ Devant un `do…while`, relisez-vous à voix haute : « je **continue tant que**... ».
---
name: break
## L'instruction `break`

Objectif : arrêter un processus répétitif.

```c
char reponse;
while(1){
  printf("Souhaitez-vous arrêter la boucle ? (o/n)\n");
  scanf_s("%c", &reponse, 1);
  viderTampon();
  if(reponse == 'o') break;
}
```
---
## L'instruction `continue`

Objectif : ignorer une partie d'un processus répétitif.

```c
char reponse;
while(1){
  printf("Souhaitez-vous aller plus loin ? (o/n)\n");
  scanf_s("%c", &reponse, 1);
  viderTampon();
  if(reponse == 'n') continue;
  printf("Vous avez été plus loin !\n");
}
```
---
name: saisie
## Le contrôle de saisie

Objectif : ne laisser passer que ce qui est valide. Le schéma est **toujours** le même.

```c
do{
  // demander la valeur
  // la lire
} while( /* la valeur n'est PAS valide */ );
```

→ On demande **d'abord**, on teste **ensuite** : c'est exactement ce que fait le `do…while`.

→ Avec un `while`, il faudrait écrire la saisie **deux fois** : avant la boucle, puis dans la boucle.

→ La condition du `while` est la **négation** de la condition de validité : c'est là qu'interviennent les lois de <a href="#intervalles">De Morgan</a>.
---
### Deux conditions d'arrêt

Certaines boucles s'arrêtent pour **deux raisons différentes** : le succès, ou l'épuisement.

```c
do{
  // une tentative
  // compteur++
} while( !reussi && compteur < maximum );
```

→ La boucle continue tant que **ni** l'une **ni** l'autre condition d'arrêt n'est atteinte : d'où le `&&`.

→ Après la boucle, il faut **savoir pourquoi** on est sorti. Un booléen (`reussi`) le mémorise ; sans lui, impossible de distinguer le succès de l'échec.

→ Le compteur ne s'incrémente que dans le cas d'échec, sinon une réussite consommerait une tentative.
---
name: accumulateur
## Les accumulateurs

Un **accumulateur** est une variable déclarée **avant** la boucle, mise à jour **à chaque tour**, et lue **après**.

| Je veux... | Initialisation | Dans la boucle |
| --- | --- | --- |
| une somme | `somme = 0` | `somme += n;` |
| un produit, une factorielle | `produit = 1` | `produit *= n;` |
| un compteur | `compteur = 0` | `compteur++;` |
| un maximum | **la première valeur lue** | `if(n > max) max = n;` |
| un minimum | **la première valeur lue** | `if(n < min) min = n;` |

→ `0` pour une somme, `1` pour un produit : sinon tout est écrasé ou annulé.

→ **Ne jamais** initialiser un maximum à `0` : avec une série de valeurs toutes négatives, le résultat serait `0`, qui ne fait pas partie de la série. On lit la première valeur **hors** de la boucle et on la prend comme maximum de départ.

→ Attention aux dépassements : au-delà de 12!, un `int` déborde sans prévenir.
---
name: sentinelle
## Les boucles à sentinelle (ou gardien)

Le nombre de tours n'est **pas connu** : c'est une valeur particulière, la **sentinelle**, qui annonce la fin.

```c
// lire la première valeur AVANT la boucle
while( /* la valeur n'est pas la sentinelle */ ){
  // traiter la valeur
  // lire la valeur SUIVANTE, en fin de corps
}
```

→ Le schéma **« lire avant, relire à la fin »** est la signature de la boucle à sentinelle.

→ La sentinelle **ne fait pas partie** des données : elle n'est ni comptée, ni additionnée, ni comparée.

→ Toujours prévoir le cas où la sentinelle est saisie **d'emblée** : le compteur vaut alors 0, et toute moyenne provoquerait une division par zéro.
---
name: chiffres
### Parcourir les chiffres d'un nombre

Deux opérateurs suffisent, et donnent les chiffres **du dernier au premier** :

| Écriture | Effet |
| --- | --- |
| `n % 10` | isole le chiffre des unités |
| `n / 10` | supprime le chiffre des unités |

→ La boucle s'arrête quand `n` atteint 0 : c'est la **division entière** qui garantit la terminaison.

→ Le nombre est **détruit** par le parcours. S'il doit servir ensuite, il faut en conserver une copie.

→ Piège : si `n` vaut 0 au départ, une boucle `while(n > 0)` ne s'exécute **jamais**. Un `do…while` traite ce cas.

→ Le même schéma s'applique en base 2 avec `% 2` et `/ 2`, et les restes sortent alors dans l'ordre inverse de l'écriture.
---
name: imbriquees
## Les boucles imbriquées

Une boucle **dans** une boucle : l'intérieure effectue **tous** ses tours à chaque tour de l'extérieure.

```c
for(int ligne = 1; ligne <= n; ligne++){     // 1 tour = 1 ligne
  for(int colonne = 1; colonne <= m; colonne++){
    // 1 tour = 1 caractère
  }
  printf("\n");                              // fin de ligne
}
```

→ La boucle **extérieure** gère les lignes, l'**intérieure** gère les colonnes.

→ Le `printf("\n")` se place **après** la boucle intérieure, **dans** la boucle extérieure.

→ Deux compteurs, deux noms différents : jamais deux fois `i`.

→ Le nombre total de tours est le **produit** des deux : `n * m`.
---
### Dessiner une figure

Pour une figure en caractères, le vrai travail n'est pas le code : c'est la **formule** qui lie le numéro de ligne au nombre de caractères.

```c
for(int ligne = 1; ligne <= hauteur; ligne++){
  for(int e = 1; e <= /* nb d'espaces */; e++)   printf(" ");
  for(int a = 1; a <= /* nb d'étoiles */; a++)   printf("*");
  printf("\n");
}
```

→ Une figure alignée à gauche ne demande **qu'une** boucle interne ; une figure centrée ou alignée à droite en demande **deux** : une pour les espaces, une pour les caractères.

→ Vérifiez toujours votre formule sur la **première** et la **dernière** ligne avant de coder.

→ Pour une table à double entrée, c'est une **largeur fixe** (`%4d`) qui aligne les colonnes, jamais des espaces tapés à la main.
---
name: hasard
## Le hasard : `rand`

```c
#include <stdlib.h>
#include <time.h>

srand(time(0));      // UNE SEULE FOIS, au début du programme

rand()               // un très grand entier positif
rand() % n           // un entier entre 0 et n - 1
```

La formule générale pour un entier entre `min` et `max` **inclus** :

```c
rand() % (max - min + 1) + min
```

→ `srand(time(0))` initialise le générateur avec l'heure courante. **Sans** cet appel, le programme tire la **même** série à chaque exécution.

→ Appeler `srand` dans une boucle est une erreur : la graine ne changerait pas et tous les tirages seraient identiques.
---
name: synthese
## Exercices de synthèse

Créez un programme qui calcule le montant d'une amende d'un excès de vitesse :
* en agglomération, si la vitesse était entre 51km/h et 60km/h, l'amende s'élève à 53€ ; ensuite, chaque km/h supplémentaire coûte 11€
* hors agglomération, l'amende est de 53€ les 10km/h qui suivent la limite autorisée ; ensuite, chaque km/h supplémentaire coûte 6€

Votre programme demandera à l'utilisateur :
* la vitesse à laquelle il roulait
* le lieu de l'infraction (agglomération ou hors agglomération)
* si nécessaire, la vitesse limite autorisée sur le lieu de l'infraction
---
## Exercices de synthèse
Créez un programme qui demande un entier à l'utilisateur et qui affiche un triangle (plein) en forme d'étoiles ayant une hauteur de taille équivalente à cet entier.

Exemple : si l'utilisateur entre la hauteur 5, le triangle aura la forme suivante.

```
     *
    ***
   *****
  *******
 *********
```
