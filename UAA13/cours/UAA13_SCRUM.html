## Qu'est-ce que SCRUM ?

Développement **itératif** et **progressif** du logiciel tout en maintenant une liste totalement transparente de **mises à jour** ou de **corrections**.

## SCRUM : items

Au lancement du projet, on découpe le système en items :

* **les tâches techniques** :
	* créer la base de données
	* initialiser le git
	* etc.
* **les user stories** : 
	* en tant qu'utilisateur, je souhaite pouvoir consulter la liste des produits
	* en tant qu'administrateur, je souhaite pouvoir enregistrer des nouveaux utilisateurs
	* etc.
---
## SCRUM : product backlog

Les user stories constituent le product backlog dans lequel ces user stories sont priorisées.
On détermine également l'effort nécessaire .

## SCRUM : sprint

* Un **sprint** est une itération d'une durée fixe (à déterminer au début du projet).

* À chaque fin de sprint correspond un **livrable**.
---
## SCRUM : sprint planning

* Le **sprint planning** se déroule avant chaque sprint.

* Il s'agit d'une réunion à laquelle participe toute l'équipe.

* On discute de ce que l'équipe de dév. pourra livrer en fin de sprint et comment l'équipe va y arriver.
---
## SCRUM : sprint backlog

* À la fin du sprint planning, les items sélectionnés du product backlog constituent le **sprint backlog**.
---
## SCRUM : daily scrum
* Le *daily scrum* se déroule tous les jours pendant un sprint
* On parle de :
	* ce qui a été fait durant les 24 dernières heures
	* ce qui va être fait durant les 24 prochaines heures
	* partage de connaissances, etc.
---
## SCRUM : sprint review
* Le **sprint review** se déroule en fin de sprint
* On fait le point sur ce qui a été fait durant le sprint
* On fait le point sur ce qui n'a pas été fait durant le sprint
* Démonstration éventuelle
---
## SCRUM : sprint retrospective
* Le sprint retrospective se déroule juste après le sprint review
